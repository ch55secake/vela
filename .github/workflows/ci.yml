name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: build app bundle
        run: ./scripts/build.sh

      - name: package app
        env:
          ARCH: arm64
        run: ./scripts/package.sh

  test:
    name: test
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: test
        run: swift test
