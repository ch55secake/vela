name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: build release
        run: swift build --configuration release

  test:
    name: test
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: test
        run: swift test
